<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>مركز التقارير</title>
<style>
:root{--bg:#F7F5F1;--panel:#fff;--p2:#F0EDE7;--accent:#C97D2C;--green:#3C8C7A;--text:#1F2A29;--dim:#6B7674;--danger:#C0463A;--warn:#C97D2C}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Tahoma,'Segoe UI',sans-serif;padding:24px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.home{color:var(--accent);font-weight:bold;text-decoration:none;font-size:13px}h1{font-size:22px;margin:0 0 5px}.sub{font-size:13px;color:var(--dim);margin-bottom:20px}.tabs,.filters,.actions{display:flex;gap:9px;flex-wrap:wrap}.tabs{margin-bottom:16px}.tab,.btn{border:1px solid rgba(0,0,0,.12);background:var(--panel);border-radius:9px;padding:9px 15px;font:inherit;font-size:12.5px;font-weight:bold;cursor:pointer}.tab.active{background:var(--green);color:#fff;border-color:var(--green)}.filters{background:var(--panel);border:1px solid rgba(0,0,0,.08);border-radius:12px;padding:15px 17px;align-items:flex-end;margin-bottom:14px}.field{display:flex;flex-direction:column;gap:4px;min-width:175px}.field label{font-size:11.5px;color:var(--dim)}input,select{background:var(--p2);border:1px solid rgba(0,0,0,.1);border-radius:8px;padding:8px 10px;font:inherit;font-size:12.5px}.btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}.btn.print{background:var(--green);color:#fff;border-color:var(--green)}.actions{margin-bottom:18px}.report{background:#fff;max-width:1100px;margin:auto;padding:28px 34px;border:1px solid rgba(0,0,0,.08);box-shadow:0 1px 8px rgba(0,0,0,.06)}.rhead{text-align:center;border-bottom:2px solid var(--green);padding-bottom:12px;margin-bottom:16px}.org{font-size:12px;line-height:1.8}.rtitle{font-size:20px;font-weight:bold;margin:8px 0 3px;color:var(--green)}.meta{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}.meta div{background:var(--p2);padding:8px 10px;border-radius:7px;font-size:11.5px}.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:9px;margin:12px 0 18px}.stat{border:1px solid rgba(0,0,0,.09);border-radius:9px;padding:10px;text-align:center}.stat b{display:block;font-size:20px;color:var(--green);margin-bottom:3px}.stat span{font-size:10.5px;color:var(--dim)}table{width:100%;border-collapse:collapse;font-size:11.5px}th{background:#E7F2EF;color:#234A42}th,td{border:1px solid #D8DEDC;padding:7px;text-align:right;vertical-align:top}.status-absent{color:var(--danger);font-weight:bold}.status-late{color:var(--warn);font-weight:bold}.empty{text-align:center;color:var(--dim);padding:35px}.note{background:#FFF8EC;border-right:4px solid var(--accent);padding:10px 12px;margin-top:14px;font-size:11.5px;line-height:1.8}.signatures{display:grid;grid-template-columns:1fr 1fr;gap:50px;margin-top:35px;text-align:center;font-size:12px}.signatures div{padding-top:28px;border-top:1px solid #777}.page-break{page-break-before:always}.group-row td{background:#F6F1E9;font-weight:bold;color:var(--accent)}.score{text-align:center}.report-footer{text-align:center;color:var(--dim);font-size:9.5px;margin-top:24px}.coverage{font-size:11px;color:var(--dim);margin:-8px 0 12px}
@media(max-width:650px){body{padding:14px 10px}.report{padding:18px 12px;overflow-x:auto}.field{min-width:100%}.meta{grid-template-columns:1fr}.tabs .tab,.actions .btn{flex:1}.signatures{gap:20px}}
@media print{body{background:#fff;padding:0}.top,.tabs,.filters,.actions{display:none!important}.report{box-shadow:none;border:none;max-width:none;padding:12mm}.no-print{display:none!important}@page{size:A4 landscape;margin:10mm}}
</style>
</head>
<body>
<div class="top"><a class="home" href="index.html">🏠 الصفحة الرئيسية</a><span style="font-size:12px;color:var(--dim)">الفصل التدريبي الأول — 1448هـ</span></div>
<h1>📄 مركز التقارير</h1>
<div class="sub">إنشاء تقارير رسمية مباشرة من البيانات المسجلة في المنظومة</div>
<div class="tabs">
  <button class="tab active" data-type="lectures">📅 متابعة المحاضرات</button>
  <button class="tab" data-type="attendance">👥 الحضور والغياب</button>
  <button class="tab" data-type="evaluation">📝 تقييم عضو هيئة التدريب</button>
</div>
<div class="filters">
  <div class="field period-field"><label>من تاريخ</label><input type="date" id="fromDate"></div>
  <div class="field period-field"><label>إلى تاريخ</label><input type="date" id="toDate"></div>
  <div class="field"><label>المدربة</label><select id="trainer"><option value="">جميع المدربات</option></select></div>
  <div class="field lecture-field"><label>الحالة</label><select id="status"><option value="">جميع الحالات</option><option>حاضرة</option><option>متأخرة</option><option>غائبة</option><option>مستأذنة</option><option>مهمة عمل</option><option>لم يتم التبليغ</option><option value="غير مسجل">غير مسجل</option></select></div>
</div>
<div class="actions"><button class="btn primary" id="generateBtn">إنشاء التقرير</button><button class="btn print" onclick="window.print()">🖨️ طباعة / حفظ PDF</button></div>
<main class="report" id="report"><div class="empty">اختاري نوع التقرير والفلاتر ثم اضغطي «إنشاء التقرير»</div></main>
<script>
let reportType='lectures', schedule=[], evalData=null;
const $=id=>document.getElementById(id), esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function parse(key,fallback={}){try{return JSON.parse(localStorage.getItem(key)||JSON.stringify(fallback))}catch(e){return fallback}}
function extractConst(text,name){const marker='const '+name+' = ',i=text.indexOf(marker);if(i<0)return null;const start=i+marker.length,open=text[start],close=open==='{'?'}':']';let depth=0,str=false,escape=false;for(let p=start;p<text.length;p++){const c=text[p];if(escape){escape=false;continue}if(c==='\\'){escape=true;continue}if(c==='"'){str=!str;continue}if(str)continue;if(c===open)depth++;if(c===close&&!--depth){try{return JSON.parse(text.slice(start,p+1))}catch(e){return null}}}return null}
async function loadSource(file,name){try{const r=await fetch(file);return r.ok?extractConst(await r.text(),name):null}catch(e){return null}}
function today(){return new Date().toISOString().slice(0,10)}
function reportHeader(title,period,trainer){return `<div class="rhead"><div class="org">المؤسسة العامة للتدريب التقني والمهني<br>الكلية التقنية الرقمية للبنات بجدة<br>قسم تقنية الحاسب والمعلومات</div><div class="rtitle">${title}</div><div style="font-size:11px;color:var(--dim)">الفصل التدريبي الأول — العام التدريبي 1448هـ</div></div><div class="meta"><div><b>الفترة:</b> ${esc(period)}</div><div><b>عضو هيئة التدريب:</b> ${esc(trainer||'الجميع')}</div><div><b>تاريخ إعداد التقرير:</b> ${today()}</div></div>`}
function signatures(){return `<div class="signatures"><div>إعداد رئيسة القسم<br><br>الاسم والتوقيع</div><div>الاعتماد<br><br>الاسم والتوقيع</div></div><div class="report-footer">تم إنشاء التقرير آلياً من لوحة متابعة قسم تقنية الحاسب والمعلومات</div>`}
function dateInRange(d){return (!$('fromDate').value||d>=$('fromDate').value)&&(!$('toDate').value||d<=$('toDate').value)}
function recordRows(){
  const records=parse('attendance-records',{}),rows=[],seen=new Set(),days=['الأحد','الاثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'];
  const from=$('fromDate').value,to=$('toDate').value;
  if(from&&to&&schedule.length){
    const d=new Date(from+'T12:00:00'),end=new Date(to+'T12:00:00');let guard=0;
    while(d<=end&&guard++<190){
      const date=d.toISOString().slice(0,10),day=days[d.getDay()];
      schedule.filter(s=>s.day===day).forEach(s=>{const key=date+'|'+s.courseCode+'_'+s.trainer+'_'+s.time+'_'+s.day,rec=records[key]||{};seen.add(key);rows.push({date,code:s.courseCode,trainer:s.trainer,time:s.time,day:s.day,status:rec.status||'غير مسجل',notes:rec.notes||'',course:s.course||'',room:s.roomDesc||s.room||'',section:s.section||''})});
      d.setDate(d.getDate()+1);
    }
  }
  Object.entries(records).forEach(([key,rec])=>{if(seen.has(key))return;const cut=key.indexOf('|');if(cut<0)return;const date=key.slice(0,cut),parts=key.slice(cut+1).split('_');const [code,trainer,time,day]=parts;if(!dateInRange(date))return;const s=schedule.find(x=>x.courseCode===code&&x.trainer===trainer&&x.time===time&&x.day===day)||{};rows.push({date,code,trainer,time,day,status:rec.status||'غير مسجل',notes:rec.notes||'',course:s.course||'',room:s.roomDesc||s.room||'',section:s.section||''})});
  return rows.sort((a,b)=>a.date.localeCompare(b.date)||a.time.localeCompare(b.time));
}
function stat(label,value){return `<div class="stat"><b>${value}</b><span>${label}</span></div>`}
function statusClass(s){return s==='غائبة'||s==='لم يتم التبليغ'?'status-absent':s==='متأخرة'?'status-late':''}
function lectureReport(){let rows=recordRows(),tr=$('trainer').value,st=$('status').value;if(tr)rows=rows.filter(r=>r.trainer===tr);if(st)rows=rows.filter(r=>r.status===st);const counts={};rows.forEach(r=>counts[r.status]=(counts[r.status]||0)+1);const period=($('fromDate').value||'بداية السجلات')+' إلى '+($('toDate').value||'نهاية السجلات');let html=reportHeader('تقرير متابعة المحاضرات',period,tr);html+=`<div class="stats">${stat('إجمالي المحاضرات',rows.length)}${stat('حاضرة',counts['حاضرة']||0)}${stat('متأخرة',counts['متأخرة']||0)}${stat('غائبة',counts['غائبة']||0)}${stat('لم يتم التبليغ',counts['لم يتم التبليغ']||0)}</div>`;html+=rows.length?`<table><thead><tr><th>#</th><th>التاريخ واليوم</th><th>المدربة</th><th>المقرر</th><th>الوقت</th><th>القاعة</th><th>الحالة</th><th>الملاحظات / الإجراء</th></tr></thead><tbody>${rows.map((r,i)=>`<tr><td>${i+1}</td><td>${esc(r.date)}<br>${esc(r.day)}</td><td>${esc(r.trainer)}</td><td>${esc(r.course)}<br><small>${esc(r.code)}</small></td><td>${esc(r.time)}</td><td>${esc(r.room)}</td><td class="${statusClass(r.status)}">${esc(r.status)}</td><td>${esc(r.notes)||'—'}</td></tr>`).join('')}</tbody></table>`:'<div class="empty">لا توجد سجلات مطابقة للفلاتر</div>';if((counts['غائبة']||0)+(counts['لم يتم التبليغ']||0)>0)html+=`<div class="note"><b>إجراء المتابعة:</b> عند الغياب تتم متابعة إشعار رئيسة القسم، وإرسال خطة التعويض عبر البريد، وإعلان المتدربات عبر المنصة، والتحقق من تسجيل الحضور والغياب في رايات.</div>`;return html+signatures()}
function attendanceReport(){let rows=recordRows(),tr=$('trainer').value;if(tr)rows=rows.filter(r=>r.trainer===tr);const grouped={};rows.forEach(r=>{const g=grouped[r.trainer]||(grouped[r.trainer]={present:0,late:0,absent:0,excused:0,mission:0,nonotify:0,total:0});if(r.status==='مستأذنة'){g.excused++;return}if(r.status==='مهمة عمل'){g.mission++;return}g.total++;if(r.status==='حاضرة')g.present++;else if(r.status==='متأخرة')g.late++;else if(r.status==='غائبة')g.absent++;else if(r.status==='لم يتم التبليغ'){g.nonotify++;g.absent++}});const data=Object.entries(grouped).map(([name,g])=>({...g,name,rate:g.total?Math.round(((g.present+g.late*.75)/g.total)*1000)/10:0})).sort((a,b)=>b.rate-a.rate);const period=($('fromDate').value||'بداية السجلات')+' إلى '+($('toDate').value||'نهاية السجلات');let html=reportHeader('تقرير الحضور والغياب لأعضاء هيئة التدريب',period,tr);html+=`<div class="coverage">طريقة الاحتساب: الحضور 100%، التأخر 75%، والاستئذان ومهمة العمل خارج نسبة الالتزام.</div>`;html+=data.length?`<table><thead><tr><th>#</th><th>عضو هيئة التدريب</th><th>حضور</th><th>تأخر</th><th>غياب</th><th>مستأذنة</th><th>مهمة عمل</th><th>لم يتم التبليغ</th><th>نسبة الالتزام</th><th>إجراء المتابعة</th></tr></thead><tbody>${data.map((g,i)=>`<tr><td>${i+1}</td><td>${esc(g.name)}</td><td>${g.present}</td><td>${g.late}</td><td>${g.absent}</td><td>${g.excused}</td><td>${g.mission}</td><td>${g.nonotify}</td><td><b>${g.rate}%</b></td><td>${g.absent||g.nonotify?'تحتاج متابعة':'لا يوجد'}</td></tr>`).join('')}</tbody></table>`:'<div class="empty">لا توجد سجلات مطابقة للفترة المحددة</div>';return html+signatures()}
function evaluationReport(){const trainer=$('trainer').value;if(!trainer)return '<div class="empty">اختاري اسم عضو هيئة التدريب لإعداد تقرير التقييم الفردي</div>';if(!evalData)return '<div class="empty">تعذر تحميل معايير التقييم. افتحي النظام من مجلد أو رابط واحد.</div>';const scores=parse('trainer-evaluation',{}),notes=parse('eval-notes',{});let total=0,rows='',lastGroup='';evalData.criteria.forEach(c=>{if(c.group!==lastGroup){rows+=`<tr class="group-row"><td colspan="5">${esc(c.group)}</td></tr>`;lastGroup=c.group}const key=trainer+'||'+c.group+'||'+c.label,score=Number(scores[key]||0);total+=score;rows+=`<tr><td>${esc(c.label)}</td><td class="score">${c.weight}</td><td class="score">${score}</td><td class="score">${c.weight?Math.round(score/c.weight*100):0}%</td><td></td></tr>`});const pct=evalData.totalWeight?Math.round(total/evalData.totalWeight*1000)/10:0;let html=reportHeader('تقرير تقييم عضو هيئة التدريب','الفصل التدريبي الأول 1448هـ',trainer);html+=`<div class="stats">${stat('الدرجة المحققة',total)}${stat('الدرجة الكلية',evalData.totalWeight)}${stat('نسبة التقييم',pct+'%')}</div><table><thead><tr><th>معيار التقييم</th><th>الوزن</th><th>الدرجة</th><th>النسبة</th><th>الشاهد / الملاحظة</th></tr></thead><tbody>${rows}</tbody></table><div class="note"><b>الملاحظات العامة:</b><br>${esc(notes[trainer]||'لا توجد ملاحظات مسجلة.')}</div>`;return html+signatures()}
function updateControls(){document.querySelectorAll('.period-field').forEach(x=>x.style.display=reportType==='evaluation'?'none':'flex');document.querySelectorAll('.lecture-field').forEach(x=>x.style.display=reportType==='lectures'?'flex':'none');$('trainer').querySelector('option').textContent=reportType==='evaluation'?'اختاري عضو هيئة التدريب':'جميع المدربات'}
function generate(){ $('report').innerHTML=reportType==='lectures'?lectureReport():reportType==='attendance'?attendanceReport():evaluationReport() }
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));b.classList.add('active');reportType=b.dataset.type;updateControls();generate()});$('generateBtn').onclick=generate;
(async()=>{schedule=parse('custom-schedule-v1',[]);if(!schedule.length){const d=await loadSource('attendance.html','SCHEDULE');if(d)schedule=d}evalData=await loadSource('evaluation_tracking.html','EVAL_DATA');const names=new Set(schedule.map(x=>x.trainer));if(evalData)evalData.trainers.forEach(x=>names.add(x));Object.keys(parse('attendance-records',{})).forEach(k=>{const p=(k.split('|')[1]||'').split('_');if(p[1])names.add(p[1])});$('trainer').innerHTML='<option value="">جميع المدربات</option>'+[...names].sort().map(n=>`<option value="${esc(n)}">${esc(n)}</option>`).join('');const now=today(),d=new Date();d.setDate(d.getDate()-7);$('fromDate').value=d.toISOString().slice(0,10);$('toDate').value=now;updateControls()})();
</script>
</body>
</html>

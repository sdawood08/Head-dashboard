<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>إشغال المعامل اليومي</title>
<style>
  :root{
    --bg:#F7F5F1; --panel:#FFFFFF; --panel-2:#F0EDE7; --line:#E4DFD6;
    --accent:#C97D2C; --accent-2:#3C8C7A; --text:#1F2A29; --text-dim:#6B7674; --danger:#C0463A;
    --prac:#3C8C7A; --theo:#C97D2C; --blend:#6C5FA8;
    --room-col:118px; --hour-w:120px;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--text);font-family:'Tahoma','Segoe UI',sans-serif;padding:24px;}
  a{color:var(--accent);}
  h1{font-size:22px;margin:0 0 4px;}
  .subtitle{color:var(--text-dim);font-size:13px;margin-bottom:18px;}
  .bar{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;margin-bottom:14px;}
  .days{display:flex;gap:6px;flex-wrap:wrap;}
  .day{border:1px solid var(--line);background:var(--panel);color:var(--text);padding:8px 16px;border-radius:10px;cursor:pointer;font-family:inherit;font-size:14px;}
  .day.on{background:var(--text);color:#fff;border-color:var(--text);}
  .day .today{font-size:10px;opacity:.7;margin-inline-start:4px;}
  .field{display:flex;flex-direction:column;gap:3px;}
  .field label{font-size:11.5px;color:var(--text-dim);}
  select,input[type=search]{padding:7px 10px;border:1px solid var(--line);border-radius:8px;font-family:inherit;font-size:13px;background:var(--panel);}
  .chk{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--text-dim);cursor:pointer;}
  button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--accent-2);outline-offset:2px;}
  .legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--text-dim);margin-bottom:10px;}
  .legend i{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-2px;margin-inline-end:5px;}
  .summary{font-size:13px;margin-bottom:10px;}
  .summary b{font-size:15px;}

  .board{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow-x:auto;}
  .grid{width:max-content;min-width:100%;padding-left:28px;}
  .row{display:flex;border-bottom:1px solid var(--line);min-height:66px;}
  .row:last-child{border-bottom:none;}
  .room{width:var(--room-col);flex:none;padding:8px 10px;border-inline-end:1px solid var(--line);position:sticky;right:0;background:var(--panel);z-index:2;}
  .room b{font-size:15px;display:block;}
  .room span{font-size:10.5px;color:var(--text-dim);}
  .room.free b{color:var(--prac);}
  .track{position:relative;flex:none;width:calc(var(--hours) * var(--hour-w));
    background-image:repeating-linear-gradient(to left, var(--line) 0 1px, transparent 1px var(--hour-w));}
  .head .track{height:30px;background:none;}
  .head .row,.row.head{min-height:30px;} .head .room{font-size:11.5px;color:var(--text-dim);display:flex;align-items:center;}
  .hour{position:absolute;top:8px;font-size:11px;color:var(--text-dim);transform:translateX(50%);}
  .blk{position:absolute;top:5px;bottom:5px;border-radius:7px;padding:4px 7px;color:#fff;font-size:11.5px;line-height:1.35;overflow:hidden;cursor:default;border:1px solid rgba(255,255,255,.35);}
  .blk .t{font-weight:bold;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .blk .c{opacity:.9;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:10.5px;}
  .blk.p{background:var(--prac);} .blk.n{background:var(--theo);} .blk.m{background:var(--blend);}
  .blk.dim{opacity:.18;}
  .blk.clash{outline:2px solid var(--danger);outline-offset:-2px;}
  .now{position:absolute;top:0;bottom:0;width:2px;background:var(--danger);z-index:1;}
  .now::before{content:'الآن';position:absolute;top:-1px;right:4px;font-size:10px;color:var(--danger);background:var(--panel);padding:0 3px;}
  .bld{width:100%;background:var(--panel-2);font-size:12px;font-weight:bold;padding:6px 10px;color:var(--text-dim);position:sticky;right:0;}
  .empty{padding:30px;text-align:center;color:var(--text-dim);}
  @media(max-width:600px){body{padding:14px 10px;} :root{--room-col:84px;--hour-w:96px;} h1{font-size:19px;}}
  @media print{.bar,.nav{display:none;} body{padding:0;} .board{overflow:visible;border:none;}}
</style>
</head>

<h1>🏫 إشغال المعامل اليومي</h1>
<div class="subtitle">اختاري اليوم وشوفي كل معمل وقاعة: مين فيها، أي مقرر، ومن كم لكم.</div>

<div class="bar">

  <button onclick="window.print()" class="day">🖨️ طباعة</button>
</div>

<div class="legend">

</div>
<div class="summary" id="summary"></div>
<div class="board"><div class="grid" id="grid"></div></div>

 "نشبك-299", "room": "3710133016", "trainer": "رهف البرقاني", "type": "تعاوني صباحي"}, {"day": "الأحد", "time": "2240 - 2100", "course": "التدريب التعاوني", "courseCode": "نشبك-299", "room": "3710133016", "trainer": "ابتسام العطوي", "type": "تعاوني صباحي"}];
const DAYS = ["الأحد","الاثنين","الثلاثاء","الأربعاء","الخميس"];
// نفس تعديلات صفحة المحاضرات
const ROOM_OVERRIDE = {'نشبك-285|الثلاثاء|1340 - 1200':'3710133015'};
function fix(r){
  const room = ROOM_OVERRIDE[r.courseCode+'|'+r.day+'|'+r.time];
  return (room && (!r.room || r.room==='غير محدد')) ? Object.assign({}, r, {room}) : r;
}
let SCHEDULE = DEFAULT_SCHEDULE;
try{
  const raw = localStorage.getItem('custom-schedule-v2');
  const p = raw ? JSON.parse(raw) : null;
  if(Array.isArray(p) && p.length) SCHEDULE = p;
}catch(e){}
SCHEDULE = SCHEDULE.map(fix).filter(r=>!(r.type||'').includes('تعاوني') && r.room && r.room!=='غير محدد');

function label(code){
  const m = String(code).match(/^37101(\d)(\d)(\d{3})$/);
  return m ? m[1] + ('ABCDEFGH'[+m[2]-1]||m[2]) + m[3].slice(1) : code;
}
function range(t){
  const p = String(t).split('-').map(s=>s.trim()); if(p.length<2) return null;
  const m = s=>+s.slice(0,2)*60 + +s.slice(2,4);
  const a=m(p[1]), b=m(p[0]); return a<b?[a,b]:[b,a];
}
const fmt = m=>String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0');
const kind = t=> (t||'').includes('عملي') ? 'p' : (t||'').includes('مدمج') ? 'm' : 'n';
const esc = s=>String(s).replace(/[&<>"]/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[ch]));

const ALL_ROOMS = [...new Set(SCHEDULE.map(r=>r.room))].sort((a,b)=>label(a).localeCompare(label(b)));
const todayName = ["الأحد","الاثنين","الثلاثاء","الأربعاء","الخميس","الجمعة","السبت"][new Date().getDay()];
let day = DAYS.includes(todayName) ? todayName : DAYS[0];

const bldSel = document.getElementById('bld');
[...new Set(ALL_ROOMS.map(r=>label(r)[0]))].sort().forEach(b=>bldSel.insertAdjacentHTML('beforeend',`<option value="${b}">مبنى ${b}</option>`));

function drawDays(){
  document.getElementById('days').innerHTML = DAYS.map(d=>`<button class="day ${d===day?'on':''}" onclick="day='${d}';drawDays();render();">${d}${d===todayName?'<span class="today">اليوم</span>':''}</button>`).join('');
}

function render(){
  const evening = document.getElementById('evening').checked;
  const bld = bldSel.value, q = document.getElementById('q').value.trim(), onlyBusy = document.getElementById('onlyBusy').checked;
  const START = 8*60, END = evening ? 23*60 : 16*60;
  const hours = (END-START)/60;
  const grid = document.getElementById('grid');
  grid.style.setProperty('--hours', hours);
  const pos = m => ((m-START)/(END-START))*100;

  const items = SCHEDULE.filter(r=>r.day===day).map(r=>({...r, rg:range(r.time)})).filter(r=>r.rg && r.rg[0] < END && r.rg[1] > START);
  const byRoom = {};
  items.forEach(r=>(byRoom[r.room]=byRoom[r.room]||[]).push(r));

  let rooms = ALL_ROOMS.filter(r=>!bld || label(r)[0]===bld);
  if(onlyBusy) rooms = rooms.filter(r=>byRoom[r]);
  if(q) rooms = rooms.filter(r=>(byRoom[r]||[]).some(x=>x.trainer.includes(q)||x.course.includes(q)));

  // الوقت الحالي
  const now = new Date(); const nowMin = now.getHours()*60+now.getMinutes();
  const showNow = day===todayName && nowMin>=START && nowMin<=END;
  const busyNow = showNow ? ALL_ROOMS.filter(r=>(byRoom[r]||[]).some(x=>x.rg[0]<=nowMin && x.rg[1]>nowMin)).length : null;
  const usedRooms = Object.keys(byRoom).length;
  document.getElementById('summary').innerHTML =
    `يوم <b>${day}</b>: ${items.length} محاضرة في <b>${usedRooms}</b> من ${ALL_ROOMS.length} قاعة` +
    (busyNow!==null ? ` — مشغولة الآن <b>${busyNow}</b>، فاضية الآن <b style="color:var(--prac)">${ALL_ROOMS.length-busyNow}</b>` : '');

  let html = `<div class="row head"><div class="room">القاعة</div><div class="track">`;
  for(let h=0; h<=hours; h++){ html += `<span class="hour" style="right:${(h/hours)*100}%">${fmt(START+h*60)}</span>`; }
  html += `</div></div>`;

  if(!rooms.length){ grid.innerHTML = html + `<div class="empty">ما فيه قاعات تطابق البحث في يوم ${day}</div>`; return; }

  let lastB = '';
  rooms.forEach(rm=>{
    const b = label(rm)[0];
    if(!bld && b!==lastB){ html += `<div class="bld">مبنى ${b}</div>`; lastB = b; }
    const list = (byRoom[rm]||[]).sort((a,b)=>a.rg[0]-b.rg[0]);
    html += `<div class="row"><div class="room ${list.length?'':'free'}"><b>${label(rm)}</b><span>${list.length ? list.length+' محاضرة' : 'فاضية طول اليوم'}</span></div><div class="track">`;
    if(showNow) html += `<div class="now" style="right:${pos(nowMin)}%"></div>`;
    list.forEach((x,i)=>{
      const s = Math.max(x.rg[0],START), e = Math.min(x.rg[1],END);
      const clash = list.some((y,j)=>j!==i && y.rg[0]<x.rg[1] && y.rg[1]>x.rg[0]);
      const match = !q || x.trainer.includes(q) || x.course.includes(q);
      const tip = `${x.course} (${x.courseCode})\n${x.trainer}\n${fmt(x.rg[0])}–${fmt(x.rg[1])} · ${x.type}`;
      html += `<div class="blk ${kind(x.type)} ${clash?'clash':''} ${match?'':'dim'}" style="right:${pos(s)}%;width:calc(${pos(e)-pos(s)}% - 3px)" title="${esc(tip)}">
        <div class="t">${esc(x.trainer)}</div><div class="c">${esc(x.course)}</div><div class="c" dir="ltr" style="text-align:right">${fmt(x.rg[0])}–${fmt(x.rg[1])}</div></div>`;
    });
    html += `</div></div>`;
  });
  grid.innerHTML = html;
}
['bld','q','onlyBusy','evening'].forEach(id=>document.getElementById(id).addEventListener('input', render));
drawDays(); render();
setInterval(()=>{ if(day===todayName) render(); }, 60000);
</script>

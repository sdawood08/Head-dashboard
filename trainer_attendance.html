function importHistoricalData() {
  var existing = {};
  try { existing = JSON.parse(localStorage.getItem(KEY) || "{}"); } catch(e) {}
  var added = 0;
  [IMPORTED_ATT, IMPORTED_ATT_2].forEach(function(src) {
    Object.keys(src).forEach(function(k) {
      if (!existing[k]) {
        existing[k] = src[k];
        added++;
      }
    });
  });
  localStorage.setItem(KEY, JSON.stringify(existing));
  att = existing;

  // مزامنة السجلات المستوردة مع Google Sheets
  var syncCount = 0;
  [IMPORTED_ATT, IMPORTED_ATT_2].forEach(function(src) {
    Object.keys(src).forEach(function(k) {
      var parts = k.split("|TR|");
      if (parts.length < 2) return;
      var date = parts[0];
      var trainer = parts[1];
      var rec = src[k];
      syncCount++;
      setTimeout(function(d,t,r){
        return function(){
          syncToSheets({
            "__sheet__": "سجل_حضور_المدربات",
            "التاريخ": d,
            "التاريخ الهجري": hijri(d),
            "اليوم": dayName(d),
            "المدربة": t,
            "الحالة": r.status || "",
            "ملاحظات": r.notes || ""
          });
        };
      }(date, trainer, rec), syncCount * 150);
    });
  });

  alert("تم استيراد " + added + " سجل من الأسابيع الأربعة\nجارٍ المزامنة مع Google Sheets...");
  render();
}
var WEBHOOK = "https://script.google.com/macros/s/AKfycbzrCds6xfATzHAV2w6LBfuwffrs5TZ_ydU4FPOKmqC4-OkzzA54zttI9koCBQThVBLL/exec";

function syncToSheets(payload) {
  try {
    var qs = Object.keys(payload).map(function(k) {
      return encodeURIComponent(k) + "=" + encodeURIComponent(payload[k]);
    }).join("&");
    fetch(WEBHOOK + "?" + qs, {method:"GET", mode:"no-cors"}).catch(function(){});
  } catch(e) {}
}
var cDate = "", cDay = "", att = {};

function load() {
  try { att = JSON.parse(localStorage.getItem(KEY) || "{}"); } catch(e) { att = {}; }
}
function save() {
  localStorage.setItem(KEY, JSON.stringify(att));
}
function hijri(ds) {
  var p = ds.split("-");
  try {
    return new Date(+p[0], +p[1]-1, +p[2]).toLocaleDateString("ar-SA-u-ca-islamic", {day:"numeric",month:"long",year:"numeric"});
  } catch(e) { return ""; }
}
function dayName(ds) {
  var p = ds.split("-");
  var m = {0:"الأحد",1:"الاثنين",2:"الثلاثاء",3:"الأربعاء",4:"الخميس",5:"الجمعة",6:"السبت"};
  return m[new Date(+p[0], +p[1]-1, +p[2]).getDay()];
}
function rk(n) { return cDate + "|TR|" + n; }

function toggleStatus(name, status) {
  var k = rk(name);
  if (!att[k]) att[k] = {};
  att[k].status = (att[k].status === status) ? "" : status;
  save();
  pushToLectures(name, att[k].status);
  syncToSheets({
    "__sheet__": "سجل_حضور_المدربات",
    "التاريخ": cDate,
    "التاريخ الهجري": hijri(cDate),
    "اليوم": cDay,
    "المدربة": name,
    "الحالة": att[k].status || "",
    "ملاحظات": (att[k].notes || "")
  });
  render();
}
function saveNote(name, val) {
  var k = rk(name);
  if (!att[k]) att[k] = {};
  att[k].notes = val;
  save();
  syncToSheets({
    "__sheet__": "سجل_حضور_المدربات",
    "التاريخ": cDate,
    "التاريخ الهجري": hijri(cDate),
    "اليوم": cDay,
    "المدربة": name,
    "الحالة": (att[rk(name)] || {}).status || "",
    "ملاحظات": val
  });
}

      var p = k.split("|");
      if (p[0] !== cDate || p.length < 2) return;
      var tn = p[1].split("_")[1];
      if (tn !== trainer) return;
      if (!la[k]) la[k] = {};
      if (status) la[k].status = status;
      else delete la[k].status;
    });
    // إضافة مفاتيح جديدة من الجدول
    if (SCHEDULE[trainer] && SCHEDULE[trainer][cDay]) {
      SCHEDULE[trainer][cDay].forEach(function(rkey) {
        var k = cDate + "|" + rkey;
        if (!la[k]) la[k] = {};
        if (status) la[k].status = status;
        else delete la[k].status;
      });
    }
    localStorage.setItem("attendance-records", JSON.stringify(la));
  } catch(e) {}
}

var STATUSES = ["حاضرة","متأخرة","غائبة","مستأذنة","مهمة عمل","لم يتم التبليغ"];
var EMOJIS   = {"حاضرة":"✅","متأخرة":"⏰","غائبة":"❌","مستأذنة":"📋","مهمة عمل":"💼","لم يتم التبليغ":"🔕"};
var ON_CLASS = {"حاضرة":"ap","متأخرة":"al","غائبة":"aa","مستأذنة":"ae","مهمة عمل":"am","لم يتم التبليغ":"an"};
var BD_CLASS = {"حاضرة":"bp","متأخرة":"bl","غائبة":"ba","مستأذنة":"be","مهمة عمل":"bm","لم يتم التبليغ":"bn"};

function el(tag, cls) {
  var e = document.createElement(tag);
  if (cls) e.className = cls;
  return e;
}
function tx(str) { return document.createTextNode(str); }

function makeCard(t) {
  var hasDay = t.days.indexOf(cDay) >= 0;
  var k = rk(t.name);
  var rec = att[k] || {};
  var st = rec.status || (hasDay ? "حاضرة" : "");

  var card = el("div", "card" + (hasDay ? "" : " dim"));

  // head
  var head = el("div", "ch");
  var name = el("span", "cn"); name.appendChild(tx(t.name));
  var badge = el("span", "cb " + (hasDay && st ? BD_CLASS[st] || "bx" : "bx"));
  badge.appendChild(tx(hasDay ? (st || "غير مسجل") : "لا محاضرات"));
  head.appendChild(name); head.appendChild(badge);
  card.appendChild(head);

  if (hasDay) {
    // أزرار الحالة
    var btns = el("div", "btns");
    STATUSES.forEach(function(s) {
      var b = el("button", "sb" + (st === s ? " " + ON_CLASS[s] : ""));
      b.appendChild(tx(EMOJIS[s] + " " + s));
      b.setAttribute("data-name", t.name);
      b.setAttribute("data-status", s);
      b.onclick = function() {
        toggleStatus(this.getAttribute("data-name"), this.getAttribute("data-status"));
      };
      btns.appendChild(b);
    });
    card.appendChild(btns);

    // ملاحظات
    var inp = el("input", "ni");
    inp.type = "text";
    inp.placeholder = "ملاحظات...";
    inp.value = rec.notes || "";
    inp.setAttribute("data-name", t.name);
    inp.onchange = function() {
      saveNote(this.getAttribute("data-name"), this.value);
    };
    card.appendChild(inp);
  } else {
    var noDay = el("div");
    noDay.style.fontSize = "11.5px";
    noDay.style.color = "var(--td)";
    noDay.appendChild(tx("لا توجد محاضرات هذا اليوم"));
    card.appendChild(noDay);
  }
  return card;
}

function makeSection(list, title) {
  var wrap = el("div");
  var hdr = el("div", "sh"); hdr.appendChild(tx(title));
  wrap.appendChild(hdr);
  var grid = el("div", "grid");
  list.forEach(function(t) { grid.appendChild(makeCard(t)); });
  wrap.appendChild(grid);
  return wrap;
}

function render() {
  document.getElementById("hjTxt").textContent = hijri(cDate);

  var p=0,l=0,a=0,e=0,m=0,n=0,nd=0;
  ALL.forEach(function(t) {
    var hasDay = t.days.indexOf(cDay) >= 0;
    var st = (att[rk(t.name)] || {}).status || (hasDay ? "حاضرة" : "");
    if (!hasDay) { nd++; return; }
    if (st==="حاضرة") p++;
    else if (st==="متأخرة") l++;
    else if (st==="غائبة") a++;
    else if (st==="مستأذنة") e++;
    else if (st==="مهمة عمل") m++;
    else if (st==="لم يتم التبليغ") n++;
  });

  var sb = document.getElementById("sbar");
  sb.innerHTML = "";
  var stats = [
    [ALL.length,"إجمالي",""],
    [p,"حاضرة","var(--ok)"],
    [l,"متأخرة","var(--warn)"],
    [a,"غائبة","var(--danger)"],
    [e,"مستأذنة","#5B6FC7"],
    [m,"مهمة","#3A5FA0"],
    [n,"لم يبلغ","#8B1A1A"],
    [nd,"لا محاضرات","var(--td)"]
  ];
  stats.forEach(function(s) {
    var div = el("div","st");
    var num = el("div","n"); if(s[2]) num.style.color=s[2]; num.appendChild(tx(String(s[0])));
    var lbl = el("div","l"); lbl.appendChild(tx(s[1]));
    div.appendChild(num); div.appendChild(lbl); sb.appendChild(div);
  });

  var c = document.getElementById("content");
  c.innerHTML = "";
  c.appendChild(makeSection(DEPT, "🖥️ قسم الحاسب وتقنية المعلومات"));
  
}

document.getElementById("expBtn").onclick = function() {
  var rows = ["\ufeffالمدربة,القسم,التاريخ,التاريخ الهجري,اليوم,الحالة,ملاحظات"];
  function addSec(list, sec) {
    list.forEach(function(t) {
      var rec = att[rk(t.name)] || {};
      var st = rec.status || (t.days.indexOf(cDay)>=0 ? "حاضرة" : "لا محاضرات");
      var notes = (rec.notes || "").replace(/"/g, "\"\"");
      rows.push('"'+t.name+'","'+sec+'",'+cDate+',"'+hijri(cDate)+'",'+cDay+','+st+',"'+notes+'"');
    });
  }
  addSec(DEPT, "الحاسب وتقنية المعلومات");
  
  var b = new Blob([rows.join("\n")], {type:"text/csv;charset=utf-8;"});
  var a = document.createElement("a");
  a.href = URL.createObjectURL(b);
  a.download = "سجل_حضور_المدربات_" + cDate + ".csv";
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
};

load();
var td = new Date();
cDate = td.getFullYear()+"-"+String(td.getMonth()+1).padStart(2,"0")+"-"+String(td.getDate()).padStart(2,"0");
document.getElementById("dInput").value = cDate;
cDay = dayName(cDate);
document.getElementById("dySel").value = cDay;
document.getElementById("dInput").onchange = function(e) {
  cDate = e.target.value;
  cDay = dayName(cDate);
  document.getElementById("dySel").value = cDay;
  render();
};
document.getElementById("dySel").onchange = function(e) {
  cDay = e.target.value;
  render();
};
render();

</script>
